<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5FF66" />
      <stop offset="100%" stop-color="#D4FF00" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#D4FF00" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep Dark Base Circle -->
  <circle cx="50" cy="50" r="47" fill="#0D111A" stroke="#1C2436" stroke-width="2" />
  
  <!-- Electric Lime Outer Open Arc (matching signature brand geometry) -->
  <path d="M 27 79 A 36 36 0 1 1 73 79" fill="none" stroke="url(#limeGrad)" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Center Asclepius Caduceus Rod -->
  <circle cx="50" cy="30" r="4.5" fill="#D4FF00" filter="url(#neonGlow)" />
  <line x1="50" y1="34" x2="50" y2="76" stroke="#D4FF00" stroke-width="3.5" stroke-linecap="round" />
  <polygon points="50,79 46.5,73 53.5,73" fill="#D4FF00" />

  <!-- Stylized Wing Left -->
  <path d="M 47 42 C 39 36 30 38 23 43 C 25 45.5 29 47 33 46.5 C 29 49 27 52 28 53.5 C 34 53.5 39 50 47 47.5 Z" fill="#D4FF00" opacity="0.95" />
  <!-- Stylized Wing Right -->
  <path d="M 53 42 C 61 36 70 38 77 43 C 75 45.5 71 47 67 46.5 C 71 49 73 52 72 53.5 C 66 53.5 61 50 53 47.5 Z" fill="#D4FF00" opacity="0.95" />

  <!-- Dual Coiling Pulse Serpents -->
  <path d="M 44 54 C 44 48 56 48 56 55 C 56 62 44 62 44 68 C 44 74 55 74 55 69" fill="none" stroke="#D4FF00" stroke-width="3" stroke-linecap="round" />
  <path d="M 56 54 C 56 48 44 48 44 55 C 44 62 56 62 56 68 C 56 74 45 74 45 69" fill="none" stroke="#D4FF00" stroke-width="3" stroke-linecap="round" />
</svg>
